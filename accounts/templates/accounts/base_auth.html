{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Halle Dress{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --plum: #5a3564;
      --plum-hover: #472850;
      --header-bg: #e8e0ef;
      --header-line: #9a88a8;
      --pill-bg: #e9e8ec;
      --text-main: #141414;
      --text-sub: #4c4654;
      --accent-blue: #3898dc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text-main);
      background-color: #e2d5ec;
      background-image:
        linear-gradient(162deg, rgba(255, 255, 255, 0.52) 0%, rgba(255, 255, 255, 0.12) 46%, transparent 46.2%),
        linear-gradient(198deg, rgba(212, 193, 228, 0.72) 0%, rgba(212, 193, 228, 0.72) 54%, transparent 54.2%),
        linear-gradient(142deg, rgba(245, 239, 250, 0.75) 0%, rgba(226, 213, 236, 0.45) 100%);
      overflow-x: hidden;
    }

    /* Top Header Bar */
    .topbar {
      background: var(--header-bg);
      border-bottom: 1.5px solid var(--header-line);
      padding: 8px 46px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 5;
    }

    .bow-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #d7c5e3;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .script-font {
      font-family: "Great Vibes", cursive;
      color: var(--plum);
      font-weight: 400;
    }

    .topbar .script-font {
      font-size: 2rem;
      line-height: 1;
      letter-spacing: 0.3px;
    }

    /* Main Split Canvas */
    .stage {
      flex: 1;
      width: 100%;
      max-width:none;
      margin: 0;
      padding: 24px 0 0 46px;
      display: grid;
      grid-template-columns: 456px 1fr;
      align-items: stretch;
      gap: 0;
    }

    /* Left Auth Card */
    .card-col {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-bottom: 24px;
      position: relative;
      z-index: 2;
    }

    .auth-card {
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      padding: 42px 44px 34px;
      box-shadow: 0 12px 28px rgba(68, 39, 79, 0.14);
    }

    .auth-card h1 {
      text-align: center;
      font-size: 1.32rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: #111111;
      margin-bottom: 24px;
    }

    .form-field {
      margin-bottom: 16px;
    }

    .form-field label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      color: #141414;
      margin-bottom: 7px;
    }

    .pill-input {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--pill-bg);
      border-radius: 999px;
      height: 46px;
      padding: 0 18px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.09);
    }

    .pill-input svg {
      width: 18px;
      height: 18px;
      color: #4f4f53;
      flex-shrink: 0;
    }

    .pill-input input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      font-family: "Poppins", sans-serif;
      font-size: 0.88rem;
      color: #18181b;
      outline: none;
    }

    .pill-input input::placeholder {
      color: #525256;
    }

    .forgot-link-wrap {
      text-align: right;
      margin-top: 6px;
      margin-bottom: 16px;
      padding-right: 4px;
    }

    .forgot-link-wrap a {
      font-size: 0.8rem;
      color: #4a4452;
      text-decoration: none;
    }

    .forgot-link-wrap a:hover {
      text-decoration: underline;
    }

    .submit-pill {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 999px;
      background: var(--plum);
      color: #ffffff;
      font-family: "Poppins", sans-serif;
      font-size: 1.02rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(90, 53, 100, 0.25);
      transition: background-color 0.18s ease;
    }

    .submit-pill:hover {
      background: var(--plum-hover);
    }

    .card-footer-link {
      text-align: center;
      margin-top: 15px;
      font-size: 0.82rem;
      color: #4a4550;
    }

    .card-footer-link a {
      color: #2b2230;
      font-weight: 800;
      text-decoration: none;
    }

    .card-footer-link a:hover {
      text-decoration: underline;
    }

    .error-box {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.8rem;
      margin-bottom: 14px;
      list-style: none;
    }

    /* Right Branding & Dress Rack */
    .hero-col {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
      padding-top: 16px;
    }

    .brand-lockup {
      text-align: center;
      padding-right:36px;
      position: relative;
      z-index: 2;
    }

    .brand-lockup .script-font {
      font-size: 4.5rem;
      line-height: 1.02;
      display: inline-block;
      padding: 0 8px 2px;
    }

    .brand-subtitle {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 1.32rem;
      font-weight: 600;
      color: #4c3255;
      position: relative;
    }

    .brand-subtitle .heart-outline {
      width: 26px;
      height: 24px;
      color: #8b7496;
      transform: translateY(3px);
      flex-shrink: 0;
    }

    .dress-showcase {
      width: 100%;
      max-width: none;
      margin-top: 12px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      line-height: 0;
    }

    .dress-showcase img {
      width: 100%;
      height: 390px;
      object-fit: cover;
      object-position: left top;
      display: block;
    }

    @media (max-width: 960px) {
      .stage {
        grid-template-columns: 1fr;
        padding: 24px 20px 32px;
      }
      .hero-col {
        display: none;
      }
      .topbar {
        padding: 8px 20px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="bow-circle" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#5a3564">
        <path d="M12 10.6C9.5 7.4 5.2 5.8 3.7 7.8c-1.5 2 1.2 5.7 5.3 5.2L5.8 19l3.7-1.1 2.5-4.1 2.5 4.1 3.7 1.1-3.2-6c4.1.5 6.8-3.2 5.3-5.2-1.5-2-5.8-.4-8.3 2.8z"/>
      </svg>
    </div>
    <span class="script-font">Halle Dress</span>
  </header>

  <main class="stage">
    <section class="card-col">
      <div class="auth-card">
        {% block card_content %}{% endblock %}
      </div>
    </section>

    <aside class="hero-col">
      <div class="brand-lockup">
        <div class="script-font">Halle Dress</div>
        <div>
          <span class="brand-subtitle">
            <span>Dresses for every you</span>
            <svg class="heart-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20.5s-7.2-4.7-9.4-9.1C1 8.1 3.3 4.8 6.8 4.8c2.1 0 3.9 1.1 5.2 2.9 1.3-1.8 3.1-2.9 5.2-2.9 3.5 0 5.8 3.3 4.2 6.6-2.2 4.4-9.4 9.1-9.4 9.1z"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="dress-showcase">
        <img src="{% static 'images/dresses.png' %}" alt="Halle Dress Collection">
      </div>
    </aside>
  </main>
</body>
</html>
